# Checks on every pull request and push, and before every release (the Release workflow
# calls this one): the helper runs its tests on Linux, macOS and Windows with the oldest
# and a current Node.js, and Claude Code validates the plugin and runs the pane tests.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  helper:
    name: Helper on ${{ matrix.os }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Scripts parse
        run: node --check scripts/sessions.mjs && node --check .github/scripts/bump-version.mjs

      - name: Scan, peek, clear, delete to the bin, move and restore
        run: node --test tests/helper-cross-platform.mjs

  plugin:
    name: Plugin and pane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manifests are valid
        run: |
          node -e '
            const fs = require("fs")
            const read = f => JSON.parse(fs.readFileSync(f, "utf8"))
            const p = read(".claude-plugin/plugin.json")
            const m = read(".claude-plugin/marketplace.json")
            const h = read("hooks/hooks.json")
            if (p.name !== "session-manager") throw new Error("plugin.json name changed")
            if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error("plugin.json version is not x.y.z")
            if (!m.plugins?.some(x => x.name === p.name)) throw new Error("marketplace.json does not list the plugin")
            for (const mod of h.modules ?? []) if (!fs.existsSync("hooks/" + mod)) throw new Error("missing hooks module " + mod)
            console.log("manifests ok,", p.name, p.version)
          '

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate .

      - name: Pane tests
        run: claude plugin test .
