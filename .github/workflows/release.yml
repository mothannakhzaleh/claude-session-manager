# Every push to main that changes the mod is tagged session-manager--v<x.y.z> and published
# as a GitHub Release with its changes. Nothing is committed to main: plugin.json has no
# version, so Claude Code takes the commit as the version and people's auto-update picks up
# each merge by itself. The release number only names the tag and the Release
# (patch + 1, or "Release-As: x.y.z" in the merged commit's message).
name: Release

on:
  push:
    branches: [main]
    # Only the mod's own files make a release; docs and repository files do not.
    paths:
      - 'hooks/**'
      - 'scripts/**'
      - 'types/**'
      - '.claude-plugin/**'
      - 'tsconfig.json'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same checks as every pull request, on Linux, macOS and Windows: nothing is released
  # unless they all pass.
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the release number
        id: ver
        run: node .github/scripts/release-version.mjs

      - name: Tag and release
        if: ${{ steps.ver.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Session Manager $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" --title "Session Manager $VERSION" --generate-notes
